# Render Blueprint for the public demo.
#
# Two services: the API as a Docker container built from api/Dockerfile, and the web app as
# a static site. The SPA calls a relative /api path (web/src/api/client.ts), which nginx
# proxies locally — on Render the rewrite rule below plays that role, so the browser still
# sees a same-origin request and no build-time API URL is needed.
services:
  - type: web
    name: quality-inspection-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # docker-entrypoint.sh applies migrations and seeders before listening, so the health
    # check only passes once the database is actually ready.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Generated by Render rather than committed: the API refuses to boot without it when
      # NODE_ENV is production (api/src/config/env.ts).
      - key: SAP_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: quality-inspection-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://quality-inspection-api.onrender.com/api/*
