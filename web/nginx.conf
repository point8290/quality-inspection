server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin, exactly like Vite's dev proxy — so the client uses relative /api paths
    # in both environments and never needs a build-time API URL.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The service worker must never be cached: a stale one would pin an old app shell
    # indefinitely, and users would have no way to get the new build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets are immutable, so they can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any path that isn't a real file renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
